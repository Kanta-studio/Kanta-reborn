name: Android visual acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Focused UI screenshots or full release validation with short video
        type: choice
        default: focused
        required: true
        options: [focused, release]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/android/app/src/main/java/ph/kanta/reborn/MainActivity.java'
      - 'apps/android/app/src/main/java/ph/kanta/reborn/StageView.java'
      - 'apps/android/app/src/main/java/ph/kanta/reborn/StageSurface.java'
      - 'apps/android/app/src/main/java/ph/kanta/reborn/CameraStage.java'
      - 'apps/android/app/src/androidTest/**'
      - 'tools/run-android-runtime.py'
      - '.github/workflows/android-visual-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: android-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  android-visual:
    if: github.actor == 'kanta-gelo' && (github.event_name == 'workflow_dispatch' || github.event.action != 'labeled' || contains(fromJSON('["owner-approved-android-visual","owner-approved-android-release-visual"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VISUAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.label.name == 'owner-approved-android-release-visual' && 'release' || 'focused') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Build app and instrumentation without starting emulator
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Real emulator visual acceptance
        run: |
          if [ "$VISUAL_MODE" = "release" ]; then
            python3 tools/run-android-runtime.py --mode release --video
          else
            python3 tools/run-android-runtime.py --mode focused
          fi
      - name: Capture failure diagnostics
        if: always()
        run: |
          if [ ! -s android-logcat.log ]; then
            timeout 20s "$ANDROID_HOME/platform-tools/adb" logcat -d > android-logcat.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-visual-evidence
          path: |
            android-visual.log
            android-runtime.log
            android-logcat.log
            emulator.log
            android-runtime-stage.png
            android-runtime-camera.png
            android-runtime-ui-*.png
            android-visual-walkthrough.mp4
          if-no-files-found: ignore
          retention-days: 7
