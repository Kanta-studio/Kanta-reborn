name: Automated CI failure triage
on:
  workflow_run:
    workflows:
      - Verified download packaging (owner-approved)
      - KANTA reconstruction validation
      - KANTA iOS unsigned artifacts
      - KANTA iOS visual walkthrough
      - KANTA iOS focused simulator smoke
      - KANTA website validation
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: failure-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Create or update failure investigation
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name + ": " + .html_url' > failed-jobs.txt
          if [ ! -s failed-jobs.txt ]; then echo "- No failed job returned by GitHub API" > failed-jobs.txt; fi
          key="[CI failure] $WORKFLOW_NAME"
          issue=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$key\") | .number" | head -1)
          {
            printf 'Automated failure report. Investigate the root cause; do not bypass assertions or disable tests.\n\n'
            printf '**Workflow:** %s\n**Run:** %s\n**Commit:** `%s`\n\n' "$WORKFLOW_NAME" "$RUN_URL" "$RUN_SHA"
            printf '**Failed jobs:**\n'
            cat failed-jobs.txt
            printf '\n**Repair gate:** Add a regression test, validate iOS and Android where affected, and merge only after required checks pass.\n'
          } > failure.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file failure.md
          else
            gh issue create --title "$key" --body-file failure.md
          fi
