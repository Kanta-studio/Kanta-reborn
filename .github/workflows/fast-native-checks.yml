name: Fast native PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'docs/TESTING.md'
      - 'docs/ARCHITECTURE.md'
permissions:
  contents: read
concurrency:
  group: fast-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changed-native-platforms:
    if: github.actor == 'kanta-gelo'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        name: Detect affected native projects
        shell: bash
        run: |
          git diff --name-only HEAD^1 HEAD > changed-native-paths.txt
          if grep -Eq '^(apps/android/|tools/|docs/(ARCHITECTURE|TESTING)\.md$|\.github/workflows/)' changed-native-paths.txt; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/ios/|tools/|docs/(ARCHITECTURE|TESTING)\.md$|\.github/workflows/)' changed-native-paths.txt; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ios=false' >> "$GITHUB_OUTPUT"
          fi
  android-fast:
    needs: changed-native-platforms
    if: needs.changed-native-platforms.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Native SoundFont validation
        run: |
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer apps/android/tests/soundfont-test.c -lm -o /tmp/kanta-soundfont-test
          /tmp/kanta-soundfont-test apps/android/app/src/main/assets/starter/kanta-tone.sf2
      - name: Build app, test APK, lint and Java regressions
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:coreRegression
      - name: Verify binary permissions and legal notices
        run: python3 tools/verify-android-runtime-package.py
      - name: Verify browser export compatibility
        run: node tools/verify-songbook-browser-interop.mjs apps/android/app/build/synthetic-songbook.json docs/evidence/website/2026-10-15/songbook.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-fast-failure
          path: |
            apps/android/app/build/reports/lint-results-debug.*
            apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
  ios-fast:
    needs: changed-native-platforms
    if: needs.changed-native-platforms.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate test targets and first-party starter assets
        run: |
          python3 ../../tools/verify-test-layout.py
          python3 -m unittest discover -s Tests/ReleaseToolingTests
          python3 -m unittest discover -s Tests -p test_starter_kar_generator.py
          python3 Tools/verify-starter-resources.py
      - name: Compile all Swift packages and tests
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee swift-test-build.log
      - name: Run all Swift unit tests
        run: |
          set -o pipefail
          swift test --skip-build --no-parallel 2>&1 | tee swift-test-results.log
      - name: Compile native iOS app without simulator execution
        run: |
          set -o pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee simulator-build.log
      - name: Collect crash reports after failures
        if: always()
        run: python3 ../../tools/collect-swift-test-crashes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ios-fast-failure
          path: |
            apps/ios/swift-*.log
            apps/ios/simulator-build.log
            apps/ios/swift-test-crashes/*
          if-no-files-found: ignore
          retention-days: 7
