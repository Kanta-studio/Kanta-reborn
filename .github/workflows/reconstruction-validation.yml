name: KANTA reconstruction validation
on:
  workflow_dispatch:
  push:
    branches: [main, fix/pr52-safe-validation-plan-20261019]
    paths:
      - 'apps/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/**'
      - 'tools/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: reconstruction-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ios:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || contains(fromJSON('["owner-approved-validation", "owner-approved-ios-validation"]'), github.event.label.name)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Tool versions and source guards
        run: |
          xcodebuild -version
          swift --version
          python3 ../../tools/verify-test-layout.py
          python3 ../../tools/check-ios-presentation-contract.py
      - name: Compile Swift package and test targets
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee swift-test-build.log
      - name: Swift package tests
        run: |
          set -o pipefail
          date +%s > swift-tests-start.txt
          swift test --skip-build --no-parallel 2>&1 | tee swift-test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-package-diagnostics
          path: apps/ios/swift-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Unsigned simulator build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Collect package crash reports
        if: always()
        run: python3 ../../tools/collect-swift-test-crashes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-reconstruction-diagnostics
          path: |
            apps/ios/*.log
            apps/ios/swift-test-crashes/*
          if-no-files-found: ignore
          retention-days: 7
