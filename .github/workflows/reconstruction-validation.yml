name: Owner-approved reconstruction validation
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: reconstruction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  android:
    if: github.actor == 'kanta-gelo' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'owner-approved-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build, lint and domain regression tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:coreRegression
      - name: Verify captured browser interoperability
        run: node tools/verify-songbook-browser-interop.mjs apps/android/app/build/synthetic-songbook.json docs/evidence/website/2026-10-15/songbook.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reconstruction-checks
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
  ios:
    if: github.actor == 'kanta-gelo' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'owner-approved-validation')
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tool versions and source guards
        run: |
          xcodebuild -version
          swift --version
          python3 -m unittest discover -s Tests/ReleaseToolingTests
          python3 -m unittest discover -s Tests -p test_starter_kar_generator.py
          python3 Tools/verify-starter-resources.py
      - name: Swift package tests
        run: swift test --parallel
      - name: Unsigned simulator build
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
