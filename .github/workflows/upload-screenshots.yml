name: Upload screenshot artifacts (PR 34)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  collect-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gather Android & iOS screenshots
        run: |
          mkdir -p artifacts/screenshots
          # Common locations: adjust to your repo layout
          cp -r android/**/screenshots artifacts/screenshots 2>/dev/null || true
          cp -r ios/**/screenshots artifacts/screenshots 2>/dev/null || true
          # If the project uses a different path, add it here
          ls -la artifacts || true
      - name: Create zip of screenshots
        run: |
          if [ -d artifacts ]; then
            zip -r screenshots.zip artifacts || true
          fi
      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focused-screenshots
          path: |
            screenshots.zip
            artifacts/screenshots
