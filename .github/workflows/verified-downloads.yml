name: Verified download packaging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/tests/test_verified_downloads.py'
      - '.github/workflows/verified-downloads.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tools/prepare-verified-downloads.py'
      - 'tools/tests/test_verified_downloads.py'
      - '.github/workflows/verified-downloads.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: verified-downloads-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check artifact identity and packaging contracts
        run: python3 -m unittest discover -s tools/tests -p test_verified_downloads.py
  package:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preserve validated application bytes
        run: python3 tools/prepare-verified-downloads.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KANTA-Android-preview-download
          path: verified-downloads/android/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KANTA-iOS-personal-unsigned-download
          path: verified-downloads/ios/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KANTA-verified-download-manifest
          path: verified-downloads/downloads.json
          if-no-files-found: error
          retention-days: 30
