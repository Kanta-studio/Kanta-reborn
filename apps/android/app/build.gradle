plugins { id 'com.android.application' }
android {
    namespace 'ph.kanta.reborn'
    compileSdk 36
    ndkVersion "27.2.12479018"
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
    defaultConfig {
        applicationId 'ph.kanta.reborn'
        minSdk 26
        targetSdk 36
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        versionCode 2
        versionName '0.2.0-reconstruction'
        testInstrumentationRunner 'ph.kanta.reborn.RuntimeChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

// Framework-free domain checks can run before spending emulator/macOS minutes.
def coreClasses = layout.buildDirectory.dir('core-regression-classes')
tasks.register('compileCoreRegression', JavaCompile) {
    source = fileTree('src/main/java') { include 'ph/kanta/reborn/core/**/*.java' }
    source += files('src/test/java/ph/kanta/reborn/core/CoreRegressionTests.java')
    classpath = files()
    destinationDirectory = coreClasses
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.register('coreRegression', JavaExec) {
    dependsOn 'compileCoreRegression'
    classpath = files(coreClasses)
    mainClass = 'ph.kanta.reborn.core.CoreRegressionTests'
    args file('src/main/assets/starter').absolutePath,
         layout.buildDirectory.file('synthetic-songbook.json').get().asFile.absolutePath
}
