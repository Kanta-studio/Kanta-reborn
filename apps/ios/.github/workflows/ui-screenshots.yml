name: KANTA UI Screenshots

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "Sources/App/**"
      - "Sources/Features/**"
      - "Sources/Core/**"
      - "Sources/Infrastructure/**"
      - "Config/**"
      - "project.yml"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'capture-ui')
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project GeloKaraoke.xcodeproj \
            -scheme GeloKaraoke \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build

          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Select simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          with open("/tmp/devices.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          available = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  udid = device.get("udid")
                  if udid and device.get("isAvailable", True):
                      available.append((name, udid))

          def exact_or_match(preferred, predicate):
              by_name = {name: udid for name, udid in available}
              for name in preferred:
                  if name in by_name:
                      return (name, by_name[name])
              for name, udid in available:
                  if predicate(name):
                      return (name, udid)
              return None

          iphone = exact_or_match(
              ["iPhone 18 Pro Max","iPhone 17 Pro Max","iPhone 16 Pro Max","iPhone 15 Pro Max","iPhone 14 Pro Max"],
              lambda name: name.startswith("iPhone") and "Pro Max" in name,
          )
          ipad = exact_or_match(
              ["iPad Pro 13-inch (M5)","iPad Pro 13-inch (M4)","iPad Air 13-inch (M4)","iPad Air 13-inch (M3)","iPad Air 13-inch (M2)","iPad Pro (12.9-inch) (6th generation)"],
              lambda name: name.startswith("iPad") and ("13-inch" in name or "12.9-inch" in name),
          )

          if iphone is None:
              raise SystemExit("No Dynamic-Island Pro Max simulator available for App Store screenshots")
          if ipad is None:
              raise SystemExit("No 13-inch/12.9-inch iPad simulator available for App Store screenshots")

          print(f"IPHONE_NAME={iphone[0]}")
          print(f"IPHONE_UDID={iphone[1]}")
          print(f"IPAD_NAME={ipad[0]}")
          print(f"IPAD_UDID={ipad[1]}")
          PY

      - name: Build iOS UI tests before starting screen recording
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'capture-ui')
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project GeloKaraoke.xcodeproj \
            -scheme GeloKaraoke \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Record real starter playback and UI taps on both simulators
        # Interactive XCTest uses the real bundled original KAR files. Opt-in
        # only; PRs remain free of this additional macOS work by default.
        id: walkthrough
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'capture-ui')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-walkthrough
          capture_interactions() {
            local label="$1" udid="$2" test_status=0
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            # simctl video is the real simulator framebuffer. It is normally
            # SILENT; a simulator recording does not prove audible DSP output.
            xcrun simctl io "$udid" recordVideo --codec=h264 \
              "ui-walkthrough/${label}-real-taps.mp4" &
            local recorder=$!
            sleep 2
            xcodebuild test-without-building \
              -project GeloKaraoke.xcodeproj \
              -scheme GeloKaraoke \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath "ui-walkthrough/${label}.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:KantaUITests/KantaVisualWalkthroughUITests \
              CODE_SIGNING_ALLOWED=NO \
              >"ui-walkthrough/${label}-test.log" 2>&1 || test_status=$?
            kill -INT "$recorder" || true
            wait "$recorder" || true
            # Preserve named screenshot attachments even when an assertion
            # fails, so a broken screen has diagnostic evidence.
            mkdir -p "ui-walkthrough/${label}-screenshots"
            xcrun xcresulttool export attachments \
              --path "ui-walkthrough/${label}.xcresult" \
              --output-path "ui-walkthrough/${label}-screenshots" \
              >"ui-walkthrough/${label}-attachments.log" 2>&1 || true
            if [[ "$test_status" -ne 0 ]]; then
              tail -n 90 "ui-walkthrough/${label}-test.log"
              echo "::error::Real tapped UI test failed on $label. See retained video and attachments."
              return "$test_status"
            fi
            test -s "ui-walkthrough/${label}-real-taps.mp4" || {
              echo "::error::Missing recorded $label walkthrough."
              return 1
            }
            echo "PASS: $label actual taps and original starter-song Host state"
            xcrun simctl shutdown "$udid" || true
          }

          failed=0
          capture_interactions iphone "$IPHONE_UDID" || failed=1
          capture_interactions ipad "$IPAD_UDID" || failed=1
          exit "$failed"

      - name: Capture real iPhone and iPad UI
        run: |
          set -euo pipefail
          mkdir -p ui-screenshots

          # Fail fast for a real app exit: a valid PNG may otherwise capture
          # SpringBoard after a crash and pass superficial dimension checks.
          capture_crash_evidence() {
            local udid="$1"
            mkdir -p ui-diagnostics
            # Simulator log show can stall for minutes after an app crash.
            # Keep it bounded so diagnostic artifacts upload before job timeout.
            python3 Tools/capture-simulator-diagnostics.py "$udid" \
              ui-diagnostics/simulator.log || true
            echo "::group::Recent bounded simulator log excerpt"
            tail -n 170 ui-diagnostics/simulator.log || true
            echo "::endgroup::"
            python3 Tools/collect-simulator-crashes.py "$udid" \
              ui-diagnostics/crashes --since "$capture_started" || true
            # Retain the exact executable and symbols; another build cannot
            # reliably symbolicate this crash, even from the same source SHA.
            mkdir -p ui-diagnostics/symbols
            cp -R "$APP_PATH" ui-diagnostics/symbols/ || true
            for symbols in build/DerivedData/Build/Products/Debug-iphonesimulator/*.dSYM; do
              [[ -d "$symbols" ]] || continue
              cp -R "$symbols" ui-diagnostics/symbols/ || true
            done
            git rev-parse HEAD > ui-diagnostics/source-sha.txt
          }

          require_live_app() {
            local udid="$1"
            local screen="$2"
            if ! xcrun simctl terminate "$udid" com.gelo.karaoke; then
              echo "::error::KANTA exited unexpectedly during ${screen} capture."
              capture_crash_evidence "$udid"
              exit 1
            fi
          }

          capture_device() {
            local label="$1"
            local udid="$2"
            local capture_started
            capture_started="$(date +%s)"

            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"

            # Capture real app navigation destinations, rather than
            # composited static mockups. The environment only selects the
            # initial screen; all rendering is from the installed app.
            local modes=(home host control library remote settings icloud legal)
            for screen in "${modes[@]}"; do
              local role="$screen"
              local controls=0
              if [[ "$screen" == "control" ]]; then
                role="host"
                controls=1
              fi
              SIMCTL_CHILD_GELO_SCREENSHOT_MODE="$role" \
              SIMCTL_CHILD_KANTA_DEMO_MODE=1 \
              SIMCTL_CHILD_KANTA_CONTROL_EXPANDED="$controls" \
              SIMCTL_CHILD_KANTA_FULLSCREEN=0 \
                xcrun simctl launch "$udid" com.gelo.karaoke
              sleep 3
              xcrun simctl io "$udid" screenshot \
                "ui-screenshots/${label}-${screen}.png"
              require_live_app "$udid" "${label}/${screen}"
            done

            # Fullscreen playback uses the same app and demo time markers.
            SIMCTL_CHILD_GELO_SCREENSHOT_MODE=host \
            SIMCTL_CHILD_KANTA_DEMO_MODE=1 \
            SIMCTL_CHILD_KANTA_CONTROL_EXPANDED=1 \
            SIMCTL_CHILD_KANTA_FULLSCREEN=1 \
              xcrun simctl launch "$udid" com.gelo.karaoke
            sleep 4
            xcrun simctl io "$udid" screenshot \
              "ui-screenshots/${label}-fullscreen.png"
            require_live_app "$udid" "${label}/fullscreen"

            if [[ "$label" == "iphone" ]]; then
              # An iPhone scene can change orientation, but simctl sometimes
              # stores its pixels in the native portrait-shaped framebuffer.
              SIMCTL_CHILD_GELO_SCREENSHOT_MODE=host \
              SIMCTL_CHILD_KANTA_DEMO_MODE=1 \
              SIMCTL_CHILD_KANTA_CONTROL_EXPANDED=1 \
              SIMCTL_CHILD_KANTA_FULLSCREEN=1 \
              SIMCTL_CHILD_KANTA_SCREENSHOT_LANDSCAPE=1 \
                xcrun simctl launch "$udid" com.gelo.karaoke
              sleep 4
              xcrun simctl io "$udid" screenshot \
                "ui-screenshots/${label}-landscape.png"
              data_dir="$(xcrun simctl get_app_container "$udid" com.gelo.karaoke data)"
              proof="$data_dir/Documents/KANTA-Simulator-Orientation.json"
              if [[ -f "$proof" ]]; then
                cp "$proof" "ui-screenshots/${label}-orientation.json"
                cat "ui-screenshots/${label}-orientation.json"
              else
                echo "::error::No iPhone orientation proof was written."
                capture_crash_evidence "$udid"
                exit 1
              fi
              # Verify the real scene first; normalize only the PNG pixels.
              python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("ui-screenshots/iphone-orientation.json").read_text())
          assert state["isLandscape"] and state["windowSize"][0] > state["windowSize"][1], state
          PY
              raw_width="$(sips -g pixelWidth "ui-screenshots/${label}-landscape.png" | awk '/pixelWidth/ {print $2}')"
              raw_height="$(sips -g pixelHeight "ui-screenshots/${label}-landscape.png" | awk '/pixelHeight/ {print $2}')"
              if (( raw_width < raw_height )); then
                sips -r 270 "ui-screenshots/${label}-landscape.png" >/dev/null
              fi
              require_live_app "$udid" "${label}/landscape"
            else
              # iPadOS windowing can reject programmatic rotation. Physical
              # rotation/resizing must be verified on device, not faked here.
              echo "iPad portrait captured; physical rotation acceptance pending."
            fi

            xcrun simctl shutdown "$udid" || true
          }

          capture_device iphone "$IPHONE_UDID"
          capture_device ipad "$IPAD_UDID"

      - name: Verify App Store screenshot dimensions
        run: |
          set -euo pipefail
          read_size() {
            local image="$1" width height
            width="$(sips -g pixelWidth "$image" | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$image" | awk '/pixelHeight/ {print $2}')"
            printf '%sx%s' "$width" "$height"
          }
          # Ensure the complete menu capture set exists on both targets.
          for device in iphone ipad; do
            for screen in home host control library remote settings icloud legal fullscreen; do
              test -s "ui-screenshots/${device}-${screen}.png" || {
                echo "::error::Missing ${device}-${screen}.png"
                exit 1
              }
            done
          done
          iphone_size="$(read_size ui-screenshots/iphone-control.png)"
          ipad_size="$(read_size ui-screenshots/ipad-control.png)"
          case "$iphone_size" in
            1260x2736|2736x1260|1290x2796|2796x1290|1320x2868|2868x1320) ;;
            *) echo "::error::Unsupported App Store iPhone screenshot size: $iphone_size"; exit 1 ;;
          esac
          case "$ipad_size" in
            2064x2752|2752x2064|2048x2732|2732x2048) ;;
            *) echo "::error::Unsupported App Store 13-inch iPad screenshot size: $ipad_size"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("ui-screenshots/iphone-orientation.json").read_text())
          if not state.get("isLandscape") or state["windowSize"][0] <= state["windowSize"][1]:
              raise SystemExit(f"::error::iPhone scene did not rotate: {state}")
          print(f"iPhone geometry verified in landscape: {state}")
          PY
          iphone_landscape="$(read_size ui-screenshots/iphone-landscape.png)"
          case "$iphone_landscape" in
            2736x1260|2796x1290|2868x1320) ;;
            *) echo "::error::Invalid normalized iPhone landscape screenshot: $iphone_landscape"; exit 1 ;;
          esac
          echo "iPad portrait accepted. iPad physical/window orientation requires manual acceptance."
          echo "App Store screenshot dimensions verified: iPhone $iphone_size; iPad $ipad_size"
          echo "iPhone singing landscape capture verified: $iphone_landscape"

      - name: Upload simulator crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanta-ui-diagnostics
          path: ui-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload real interaction videos, screenshots and XCTest logs
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'capture-ui'))
        uses: actions/upload-artifact@v4
        with:
          name: kanta-real-ui-walkthrough
          path: |
            ui-walkthrough/*.mp4
            ui-walkthrough/*-test.log
            ui-walkthrough/*-attachments.log
            ui-walkthrough/*-screenshots/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanta-ui-screenshots
          path: |
            ui-screenshots/*.png
            ui-screenshots/*-orientation.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce real-interaction capture acceptance
        if: always() && steps.walkthrough.outcome == 'failure'
        run: |
          echo "::error::Simulator real-interaction recording or UI test failed."
          exit 1



  publish:
    name: Save latest screenshots in repository
    needs: capture
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: kanta-screenshot-gallery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repository
      - uses: actions/download-artifact@v4
        with:
          name: kanta-ui-screenshots
          path: captures
      - name: Validate complete image set
        run: |
          python3 - <<'PY'
          import pathlib, struct
          for device in ("iphone", "ipad"):
              for screen in ("control", "fullscreen"):
                  path = pathlib.Path("captures") / f"{device}-{screen}.png"
                  data = path.read_bytes()
                  if not 24 <= len(data) <= 25 * 1024 * 1024:
                      raise SystemExit(f"Invalid image size: {path}")
                  if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                      raise SystemExit(f"Invalid PNG: {path}")
                  width, height = struct.unpack(">II", data[16:24])
                  if not (100 <= width <= 10000 and 100 <= height <= 10000):
                      raise SystemExit(f"Invalid dimensions: {path}")
          PY
      - name: Replace gallery atomically
        working-directory: repository
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin ui-screenshots > /dev/null; then
            git fetch origin ui-screenshots
            git switch -c ui-screenshots FETCH_HEAD
          else
            git switch --orphan ui-screenshots
          fi
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path("screenshots/latest")
          manifest = root / "capture.json"
          new_order = (int(os.environ["RUN_NUMBER"]), int(os.environ["RUN_ATTEMPT"]))
          if manifest.exists():
              old = json.loads(manifest.read_text())
              if (old["run_number"], old["run_attempt"]) >= new_order:
                  print("Keeping the newer or already-published capture.")
                  raise SystemExit(0)
          root.mkdir(parents=True, exist_ok=True)
          for device in ("iphone", "ipad"):
              for screen in ("control", "fullscreen"):
                  name = f"{device}-{screen}.png"
                  shutil.copyfile(pathlib.Path("../captures") / name, root / name)
          url = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}'
          meta = dict(source_sha=os.environ["SOURCE_SHA"], run_id=os.environ["RUN_ID"],
                      run_number=new_order[0], run_attempt=new_order[1], run_url=url)
          manifest.write_text(json.dumps(meta, indent=2) + "\n")
          text = "# KANTA latest screenshots\n\n"
          text += f'Actual simulator captures from commit `{meta["source_sha"]}`. [Workflow run]({url}).\n\n'
          text += "These images use demo data; they do not verify physical-device audio or performance.\n\n"
          for device in ("iphone", "ipad"):
              for screen in ("control", "fullscreen"):
                  name = f"{device}-{screen}.png"
                  text += f"## {device.title()} {screen}\n\n![{device} {screen}](screenshots/latest/{name})\n\n"
          pathlib.Path("README.md").write_text(text)
          PY
          git add -- README.md screenshots/latest
          if git diff --cached --quiet; then
            echo "Gallery already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshot gallery for run $RUN_NUMBER [skip ci]"
          git push origin HEAD:refs/heads/ui-screenshots
          echo "Gallery: $SERVER_URL/$REPOSITORY/tree/ui-screenshots" >> "$GITHUB_STEP_SUMMARY"

