name: GeloKaraoke

options:
  createIntermediateGroups: true

packages:
  GeloKaraokePackage:
    path: .

targets:
  GeloKaraoke:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - README.md
      - path: Sources/Features
        excludes:
          - README.md
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GeloKaraokePackage
        product: GeloKaraokeCore
      - package: GeloKaraokePackage
        product: LibraryStorage
      - package: GeloKaraokePackage
        product: AVFoundationPlayback
      - package: GeloKaraokePackage
        product: AVFoundationMIDIPlayback
      - package: GeloKaraokePackage
        product: LocalNetworkControl
      - package: GeloKaraokePackage
        product: MicrophoneScoring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelo.karaoke
        PRODUCT_NAME: KANTA
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/GeloKaraoke-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KANTA.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

schemes:
  GeloKaraoke:
    build:
      targets:
        GeloKaraoke: all
    run:
      config: Debug
    archive:
      config: Release

