name: Manual TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload a signed INTERNAL-ONLY TestFlight build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require main for signing
        if: inputs.upload_to_testflight
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - name: Validate signing inputs before allocating macOS
        if: inputs.upload_to_testflight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: python3 Tools/check-signing-readiness.py
      - name: Validate release tooling
        run: python3 -m unittest discover -s Tests/ReleaseToolingTests -p 'test_*.py'

  build-and-deploy:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release guards
        run: |
          set -euo pipefail
          bash Tools/verify-commercial-assets.sh
          bash Tools/verify-media-provenance.sh
          bash Tools/verify-ios-privacy.sh
          bash Tools/verify-release-metadata.sh
      - name: Xcode upload SDK gate
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/ {split($2,v,"."); print v[1]; exit}')"
          test "${major:-0}" -ge 26
      - name: Swift package tests
        run: swift test
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned Release simulator app
        if: ${{ !inputs.upload_to_testflight }}
        run: >-
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Prepare unique build identity and private signing paths
        if: inputs.upload_to_testflight
        run: |
          set -euo pipefail
          python3 Tools/prepare-testflight.py
          umask 077
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
      - name: Install App Store Connect API key
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'appstoreconnect/private_keys'
          key = directory / ('AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8')
          key.write_bytes(base64.b64decode(''.join(os.environ['APP_STORE_CONNECT_API_KEY_P8_BASE64'].split()), validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ASC_KEY_PATH={key}\nAPI_PRIVATE_KEYS_DIR={directory}\n')
          PY
      - name: Install Apple Distribution certificate
        if: inputs.upload_to_testflight
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          cert_path="$RUNNER_TEMP/distribution.p12"
          keychain_path="$RUNNER_TEMP/kanta-signing.keychain-db"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'distribution.p12').write_bytes(base64.b64decode(''.join(os.environ['APPLE_DISTRIBUTION_CERT_P12_BASE64'].split()), validate=True))
          PY
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'
      - name: Archive signed iOS app
        if: inputs.upload_to_testflight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project GeloKaraoke.xcodeproj -scheme GeloKaraoke \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KANTA.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$KANTA_BUILD_NUMBER" archive
      - name: Export internal-only signed IPA
        if: inputs.upload_to_testflight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 Tools/prepare-testflight.py --export-options
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KANTA.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
      - name: Validate and upload to internal TestFlight
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -s "$API_PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          printf 'Uploaded internal-only KANTA build %s from commit %s. Apple processing and device acceptance remain pending.\n' \
            "$KANTA_BUILD_NUMBER" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve signed IPA and debug symbols
        if: inputs.upload_to_testflight && success()
        uses: actions/upload-artifact@v4
        with:
          name: kanta-internal-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ runner.temp }}/KANTA.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup signing material
        if: always() && inputs.upload_to_testflight
        run: |
          security delete-keychain "$RUNNER_TEMP/kanta-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/appstoreconnect" "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/ExportOptions.plist"
